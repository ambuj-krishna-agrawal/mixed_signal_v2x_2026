[project]
name = "rangeview-v2x"
version = "1.0.0"
description = "Mixed Signals V2X (ICCV 2025) — range-view fusion detector on 5 LiDAR agents."
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "shapely>=2.0",
  "tensorboard>=2.16",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "pandas>=2.2",
  "matplotlib>=3.8",
  "huggingface_hub>=0.24",
  "scikit-learn>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rangeview"]

[tool.uv]
package = true
